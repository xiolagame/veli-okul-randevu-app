# PREPARATION ONLY. Do not run without approval and dedicated review-only secrets/TLS.
services:
  review-db:
    image: postgres:17.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: veli_review
      POSTGRES_USER: review_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/tls/server.crt, -c, ssl_key_file=/tls/server.key]
    secrets: [db-password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${REVIEW_SECRETS_DIR:?external secret directory required}/db-tls:/tls:ro
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U review_owner -d veli_review]
      interval: 15s
      timeout: 5s
      retries: 5
  review-api:
    build: {context: ../.., dockerfile: deploy/review/Dockerfile}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      REVIEW_SERVICE_ENABLED: 'true'
      REVIEW_DATABASE_HOST: review-db
      REVIEW_BIND_HOST: 0.0.0.0
      REVIEW_TRUST_PROXY_HOPS: '1'
      REVIEW_DATABASE_URL_FILE: /run/secrets/database-url
      REVIEW_JWT_SECRET_FILE: /run/secrets/jwt-secret
      REVIEW_IDENTITIES_JSON_FILE: /run/secrets/identities
      SUPABASE_DB_CA_B64_FILE: /run/secrets/db-ca-b64
      REVIEW_AUDIT_FILE: /audit/access.jsonl
      REVIEW_ALLOWED_ORIGINS: ${REVIEW_ALLOWED_ORIGINS:?explicit origins required}
    secrets: [database-url, jwt-secret, identities, db-ca-b64]
    volumes: ["${REVIEW_AUDIT_DIR:?pre-created audit directory required}:/audit"]
    tmpfs: [/tmp]
    networks: [isolated]
    depends_on:
      review-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3100/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
  review-https:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${REVIEW_SECRETS_DIR:?external secret directory required}/https-tls:/tls:ro
    networks: [public, isolated]
    depends_on: [review-api]
networks:
  isolated: {internal: true}
  public: {}
volumes:
  db-data: {}
secrets:
  db-password: {file: "${REVIEW_SECRETS_DIR:?}/db-password"}
  database-url: {file: "${REVIEW_SECRETS_DIR:?}/database-url"}
  jwt-secret: {file: "${REVIEW_SECRETS_DIR:?}/jwt-secret"}
  identities: {file: "${REVIEW_SECRETS_DIR:?}/identities.json"}
  db-ca-b64: {file: "${REVIEW_SECRETS_DIR:?}/db-ca-b64"}

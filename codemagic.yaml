workflows:
  ios-ci-check:
    name: iOS CI Check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
      node: 24.17.0
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        DERIVED_DATA_PATH: "build/DerivedData"
        SOURCE_PACKAGES_PATH: "build/SourcePackages"
        XCODE_LOG_PATH: "build/logs"
    scripts:
      - name: Show pinned tool versions
        script: |
          set -euo pipefail
          node --version
          npm --version
          xcodebuild -version
          swift --version

      - name: Install locked JavaScript dependencies
        script: |
          set -euo pipefail
          npm ci
          npx cap --version

      - name: Install optional Firebase iOS config
        script: |
          set -euo pipefail
          if [ -n "${FCM_GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            test -f "$FCM_GOOGLE_SERVICE_INFO_PLIST"
            cp "$FCM_GOOGLE_SERVICE_INFO_PLIST" ios/App/App/GoogleService-Info.plist
          fi

      - name: Build and sync the Capacitor iOS shell
        script: |
          set -euo pipefail
          npm run ios:sync

      - name: Run TypeScript and focused regression checks
        script: |
          set -euo pipefail
          npm run lint
          npm run test:mobile-platform
          npm run test:secure-storage
          npm run test:ios-shell
          npm run test:ios-push
          npm run test:push-notifications
          npm run test:account-deletion

      - name: Build production web and server artifacts
        script: |
          set -euo pipefail
          npm run build

      - name: Verify Capacitor sync preserved native project settings
        script: |
          set -euo pipefail
          git diff --exit-code -- \
            ios/App/App.xcodeproj/project.pbxproj \
            ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme \
            ios/App/App/Info.plist \
            ios/App/App/PrivacyInfo.xcprivacy \
            ios/App/App/AppDelegate.swift \
            ios/App/App/SceneDelegate.swift \
            ios/App/CapApp-SPM/Package.swift

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/$XCODE_LOG_PATH"
          xcodebuild \
            -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/$SOURCE_PACKAGES_PATH" \
            2>&1 | tee "$CM_BUILD_DIR/$XCODE_LOG_PATH/spm-resolution.log"

      - name: Build unsigned iOS Simulator app
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$CM_BUILD_DIR/$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/$SOURCE_PACKAGES_PATH" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            2>&1 | tee "$CM_BUILD_DIR/$XCODE_LOG_PATH/xcodebuild-unsigned.log"
    artifacts:
      - build/logs/*.log
      - build/DerivedData/Build/Products/Release-iphonesimulator/App.app
      - ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  ios-signed-ipa:
    name: iOS Signed IPA (manual)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic Veli Randevu"
    environment:
      groups:
        - firebase_credentials
      xcode: 26.6
      node: 24.17.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.velirandevu.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: "6823597940"
        SOURCE_PACKAGES_PATH: "build/SourcePackages"
        XCODE_LOG_PATH: "build/logs"
    scripts:
      - name: Show pinned tool versions
        script: |
          set -euo pipefail
          node --version
          npm --version
          xcodebuild -version
          swift --version

      - name: Install locked JavaScript dependencies
        script: |
          set -euo pipefail
          npm ci
          npx cap --version

      - name: Build and sync the Capacitor iOS shell
        script: |
          set -euo pipefail
          npm run ios:sync

      - name: Require Firebase iOS config for signed IPA
        script: |
          set -euo pipefail
          if [ -z "${FCM_GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "Required Codemagic secret FCM_GOOGLE_SERVICE_INFO_PLIST is unavailable."
            exit 1
          fi
          PLIST_PATH="$CM_BUILD_DIR/ios/App/App/GoogleService-Info.plist"
          umask 077
          printf '%s' "$FCM_GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > "$PLIST_PATH"
          plutil -lint "$PLIST_PATH" >/dev/null

      - name: Run TypeScript and focused regression checks
        script: |
          set -euo pipefail
          npm run lint
          npm run test:mobile-platform
          npm run test:secure-storage
          npm run test:ios-shell
          npm run test:ios-push
          npm run test:push-notifications
          npm run test:account-deletion

      - name: Build production web and server artifacts
        script: |
          set -euo pipefail
          npm run build

      - name: Verify Capacitor sync preserved native project settings
        script: |
          set -euo pipefail
          git diff --exit-code -- \
            ios/App/App.xcodeproj/project.pbxproj \
            ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme \
            ios/App/App/Info.plist \
            ios/App/App/PrivacyInfo.xcprivacy \
            ios/App/App/AppDelegate.swift \
            ios/App/App/SceneDelegate.swift \
            ios/App/CapApp-SPM/Package.swift

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/$XCODE_LOG_PATH"
          xcodebuild \
            -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/$SOURCE_PACKAGES_PATH" \
            2>&1 | tee "$CM_BUILD_DIR/$XCODE_LOG_PATH/spm-resolution.log"

      - name: Set unique App Store build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          echo "Using App Store build number $NEXT_BUILD_NUMBER"

      - name: Apply App Store signing profile
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Verify signed IPA for App Store Connect
        script: |
          set -euo pipefail
          IPAS=("$CM_BUILD_DIR"/build/ios/ipa/*.ipa)
          if [ "${#IPAS[@]}" -ne 1 ] || [ ! -f "${IPAS[0]}" ]; then
            echo "Expected exactly one signed IPA."
            exit 1
          fi
          CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$CHECK_DIR"' EXIT
          ditto -x -k "${IPAS[0]}" "$CHECK_DIR" >/dev/null
          APP_PATH="$CHECK_DIR/Payload/App.app"
          FIREBASE_PLIST="$APP_PATH/GoogleService-Info.plist"
          if [ ! -d "$APP_PATH" ] || [ ! -f "$FIREBASE_PLIST" ]; then
            echo "IPA is missing the app or Firebase plist."
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH" >/dev/null 2>&1
          codesign --display --entitlements - --xml "$APP_PATH" > "$CHECK_DIR/entitlements.plist" 2>/dev/null
          plutil -lint "$APP_PATH/Info.plist" "$FIREBASE_PLIST" "$CHECK_DIR/entitlements.plist" >/dev/null
          EXPECTED_BUNDLE_ID="com.velirandevu.app"
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist")" = "$EXPECTED_BUNDLE_ID" ]
          [ "$(plutil -extract BUNDLE_ID raw -o - "$FIREBASE_PLIST")" = "$EXPECTED_BUNDLE_ID" ]
          [ "$(plutil -extract aps-environment raw -o - "$CHECK_DIR/entitlements.plist")" = "production" ]
          echo "Signed IPA bundle ID, Firebase plist, and production push entitlement verified."
    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
